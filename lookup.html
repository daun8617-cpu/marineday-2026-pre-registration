<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>사전등록 조회 | MARINE DAY 2026</title>
<meta name="description" content="마린데이 2026 사전등록 내역 조회" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="stylesheet" href="assets/register.css" />
<link rel="stylesheet" href="assets/lookup.css" />
</head>
<body>
<div class="page">

  <header class="reg-header">
    <a class="back-button" href="register.html" aria-label="뒤로 가기">
      <img src="assets/arrow-left.svg" alt="" />
    </a>
    <p class="reg-header-title">사전등록 조회</p>
    <span class="reg-header-spacer" aria-hidden="true"></span>
  </header>

  <form class="reg-form" id="lookup-form" novalidate>
    <div class="reg-intro">
      <span class="badge">INQUIRY &amp; CANCEL</span>
      <h1 class="reg-title">사전등록 내역 조회</h1>
    </div>

    <div class="reg-fields">
      <div class="field">
        <label class="field-label" for="l-name">이름</label>
        <input class="field-input" id="l-name" name="name" type="text" placeholder="김마린" autocomplete="name" required />
      </div>

      <div class="field">
        <label class="field-label" for="l-phone">연락처</label>
        <input class="field-input" id="l-phone" name="phone" type="tel" placeholder="01012345678" autocomplete="tel" pattern="[0-9\-]{9,13}" required />
      </div>
    </div>

    <button class="submit-btn" type="submit">조회하기</button>

    <div class="result-card" id="result-card" hidden>
      <div class="result-head">
        <p class="result-title">조회된 등록 내역</p>
        <span class="result-status" id="result-status">등록완료</span>
      </div>
      <div class="result-divider"></div>
      <div class="result-rows">
        <div class="result-row">
          <span class="result-key">이름</span>
          <span class="result-value" id="result-name">-</span>
        </div>
        <div class="result-row">
          <span class="result-key">연락처</span>
          <span class="result-value" id="result-phone">-</span>
        </div>
        <div class="result-row">
          <span class="result-key">이메일</span>
          <span class="result-value" id="result-email">-</span>
        </div>
        <div class="result-row">
          <span class="result-key">소속 기관 / 회사</span>
          <span class="result-value" id="result-org">-</span>
        </div>
        <div class="result-row">
          <span class="result-key">등록일</span>
          <span class="result-value" id="result-date">-</span>
        </div>
      </div>
    </div>

    <div class="lookup-cancel-block" id="cancel-block" hidden>
      <button type="button" class="cancel-btn" id="cancel-btn">사전등록 취소하기</button>
      <p class="cancel-caption">등록 취소 후에는 사전등록이 취소 상태로 변경됩니다.</p>
    </div>
  </form>

</div>
<script src="assets/lookup.js"></script>
</body>
</html>
