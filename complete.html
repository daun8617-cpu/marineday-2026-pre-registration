<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>사전등록 완료 | MARINE DAY 2026</title>
<meta name="description" content="마린데이 2026 사전등록이 완료되었습니다." />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="stylesheet" href="assets/complete.css" />
<link rel="stylesheet" href="assets/qr-card.css" />
<link rel="stylesheet" href="assets/lookup.css" />
</head>
<body>
<div class="page">

  <div class="complete-body">
    <div class="complete-head">
      <div class="complete-badge">
        <div class="complete-badge-inner">
          <div class="complete-badge-check">
            <img src="assets/complete-check.svg" alt="" />
          </div>
        </div>
      </div>
      <h1 class="complete-title">사전등록이 완료되었습니다!</h1>
    </div>

    <div class="qr-card" id="qr-card" hidden>
      <p class="qr-heading">체크인용 QR 코드</p>
      <div class="qr-box"><canvas id="qr-canvas"></canvas></div>
      <p class="qr-caption">행사 당일 입장 시 이 QR 코드를 제시해 주세요.</p>
    </div>

    <div class="qr-missing" id="qr-missing" hidden>
      <p class="qr-missing-text">QR 코드를 불러올 수 없습니다. <a href="lookup.html">사전등록 조회</a>에서 다시 확인해 주세요.</p>
    </div>

    <div class="summary-card">
      <p class="summary-heading">사전등록 정보 요약</p>
      <div class="summary-rows">
        <div class="summary-row">
          <span class="summary-key">참석자</span>
          <span class="summary-value" id="summary-name">-</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-row">
          <span class="summary-key">이메일</span>
          <span class="summary-value" id="summary-email">-</span>
        </div>
      </div>
    </div>

    <div class="event-card">
      <div class="event-icon">
        <img src="assets/complete-calendar.svg" alt="" />
      </div>
      <div class="event-info">
        <span class="event-label">행사 일정</span>
        <span class="event-value">2026년 11월 18일 수요일</span>
      </div>
    </div>
  </div>

  <div class="complete-footer">
    <a class="home-btn" href="index.html">홈으로 돌아가기</a>
    <div class="lookup-cancel-block">
      <button type="button" class="cancel-btn" id="cancel-btn">사전등록 취소하기</button>
      <p class="cancel-caption">등록 취소 후에는 사전등록이 취소 상태로 변경됩니다.</p>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script src="assets/complete.js"></script>
</body>
</html>
