<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>QR Check-in — Display Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 32px 16px;
    background: #0b0f14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  #qr-box {
    background: #fff;
    padding: 24px;
    border-radius: 20px;
    line-height: 0;
  }
  #qr-canvas {
    width: 360px;
    height: 360px;
  }
  .name {
    font-size: 22px;
    font-weight: 700;
    color: #e6edf3;
  }
</style>
</head>
<body>

  <div id="qr-box"><canvas id="qr-canvas"></canvas></div>
  <p class="name">QR체크인테스트</p>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    var QR_TOKEN = "c7cc52bfaa8ff1525fc593a692dce91150949db73a4ecedf97567f736a58a189";

    QRCode.toCanvas(document.getElementById('qr-canvas'), QR_TOKEN, {
      width: 360,
      margin: 1,
      errorCorrectionLevel: 'M'
    }, function (err) {
      if (err) console.error('QR generation failed:', err);
    });
  </script>

</body>
</html>
