<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Journey CSS 3D Depth Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="assets/journey-css3d-test.css" />
</head>
<body>

  <div class="cd-progress" id="cdProgress">[00%]</div>

  <!-- fixed header: stays constant across every slide, not part of the 3D depth space -->
  <header class="cd-header">
    <span class="cd-part-badge">PART 1.</span>
    <span class="cd-part-title">THE JOURNEY</span>
    <span class="cd-part-sub">우리가 걸어온 시간</span>
  </header>

  <section class="cd-stage" id="cdStage">
    <div class="cd-space" id="cdSpace">

      <!-- slide 0: journey overview -->
      <article class="cd-slide" data-index="0">
        <div class="cd-photo cd-photo--overview">
          <img src="assets/journey-photos/overview.jpg" alt="" />
        </div>
        <div class="cd-text cd-text--overview">
          <p class="cd-title cd-title--overview">History of<br />Marine day</p>
          <p class="cd-sub">MARINE DAY&nbsp;&nbsp;·&nbsp;&nbsp;SEMINAR</p>
        </div>
        <h2 class="cd-year cd-year--overview">'2016-2026</h2>
      </article>

      <!-- slide 1: 2016 — ECDIS+ 기술세미나 -->
      <article class="cd-slide" data-index="1">
        <div class="cd-photo cd-photo--s1">
          <img src="assets/journey-photos/2016-01.jpg" alt="" />
        </div>
        <div class="cd-text cd-text--s1">
          <p class="cd-title cd-title--s1">ECDIS+기술세미나</p>
          <p class="cd-desc">마린데이는 지난 10년 동안 사람과 기술을 잇는 연결의 장이 되어, 해양 산업의 새로운 가능성을 함께 만들어 왔습니다.</p>
          <p class="cd-tags">ECDIS&nbsp;&nbsp;·&nbsp;&nbsp;DIGITALIZATION&nbsp;&nbsp;·&nbsp;&nbsp;SMART SHIP</p>
        </div>
        <h2 class="cd-year cd-year--s1">'2016</h2>
      </article>

      <!-- slide 2: 2016 — gallery (no title/desc, two stacked photos) -->
      <article class="cd-slide" data-index="2">
        <div class="cd-photo cd-photo--s2a">
          <img src="assets/journey-photos/2016-02.jpg" alt="" />
        </div>
        <div class="cd-photo cd-photo--s2b">
          <img src="assets/journey-photos/2016-03.jpg" alt="" />
        </div>
        <h2 class="cd-year cd-year--s1">'2016</h2>
      </article>

    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="assets/journey-css3d-test.js"></script>
</body>
</html>
